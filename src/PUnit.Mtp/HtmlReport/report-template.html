<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>PUnit run report</title>
<style>
  /* ---------- LIGHT PALETTE (default) ---------- */
  :root{
    color-scheme: light;
    --bg:#eef1f5; --bg-grad:#e7ebf1;
    --surface:#ffffff; --surface-2:#f5f7fa; --inset:#eef1f4;
    --border:#e3e7ec; --border-strong:#d2d8df;
    --ink:#1b2027; --muted:#5b636e; --faint:#8b929c;
    --pass:#1a9c50; --fail:#d23636; --skip:#9a6b0c;
    --pass-text:#15803d; --fail-text:#b91c1c; --skip-text:#8a5e0a;
    --pass-bg:#e4f5ea; --fail-bg:#fbe8e8; --skip-bg:#f6edd6;
    --bar-pass:#22a35a; --bar-fail:#dc3b3b; --bar-skip:#a7740f; --bar-text:#ffffff;
    --ph-given:#2f74d0; --ph-when:#8350c4; --ph-then:#0c8576;
    --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
    --v-create:#2563eb; --v-read:#0d9488; --v-edit:#e07a14; --v-delete:#9333ea;
    --grid:rgba(20,28,40,.06); --lifeline:#cdd4dc; --ruler-text:#8b929c;
    --accent:#3b62e8;
    --shadow:0 1px 2px rgba(17,24,39,.06), 0 6px 16px rgba(17,24,39,.06);
    --shadow-sm:0 1px 2px rgba(17,24,39,.07);
  }
  /* ---------- DARK PALETTE (auto) ---------- */
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0d1117; --bg-grad:#0b0f14;
      --surface:#161b22; --surface-2:#1b2230; --inset:#10151d;
      --border:#2a313c; --border-strong:#39414e;
      --ink:#e6edf3; --muted:#9aa4b0; --faint:#6c7682;
      --pass:#3fb950; --fail:#f0524a; --skip:#d4a13a;
      --pass-text:#56d364; --fail-text:#ff7b72; --skip-text:#e3b341;
      --pass-bg:rgba(63,185,80,.15); --fail-bg:rgba(240,82,74,.15); --skip-bg:rgba(212,161,58,.16);
      --bar-pass:#2ea043; --bar-fail:#da3633; --bar-skip:#b9842a; --bar-text:#ffffff;
      --ph-given:#3f82e6; --ph-when:#9a6ae0; --ph-then:#1aa48d;
      --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
      --v-create:#4f8bff; --v-read:#2dd4bf; --v-edit:#f59e3c; --v-delete:#c07bf0;
      --grid:rgba(180,200,230,.07); --lifeline:#39414e; --ruler-text:#6c7682;
      --accent:#5b86ff;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    }
  }
  /* ---------- EXPLICIT OVERRIDES (screenshot-deterministic) ---------- */
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#eef1f5; --bg-grad:#e7ebf1;
    --surface:#ffffff; --surface-2:#f5f7fa; --inset:#eef1f4;
    --border:#e3e7ec; --border-strong:#d2d8df;
    --ink:#1b2027; --muted:#5b636e; --faint:#8b929c;
    --pass:#1a9c50; --fail:#d23636; --skip:#9a6b0c;
    --pass-text:#15803d; --fail-text:#b91c1c; --skip-text:#8a5e0a;
    --pass-bg:#e4f5ea; --fail-bg:#fbe8e8; --skip-bg:#f6edd6;
    --bar-pass:#22a35a; --bar-fail:#dc3b3b; --bar-skip:#a7740f; --bar-text:#ffffff;
    --ph-given:#2f74d0; --ph-when:#8350c4; --ph-then:#0c8576;
    --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
    --v-create:#2563eb; --v-read:#0d9488; --v-edit:#e07a14; --v-delete:#9333ea;
    --grid:rgba(20,28,40,.06); --lifeline:#cdd4dc; --ruler-text:#8b929c;
    --accent:#3b62e8;
    --shadow:0 1px 2px rgba(17,24,39,.06), 0 6px 16px rgba(17,24,39,.06);
    --shadow-sm:0 1px 2px rgba(17,24,39,.07);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0d1117; --bg-grad:#0b0f14;
    --surface:#161b22; --surface-2:#1b2230; --inset:#10151d;
    --border:#2a313c; --border-strong:#39414e;
    --ink:#e6edf3; --muted:#9aa4b0; --faint:#6c7682;
    --pass:#3fb950; --fail:#f0524a; --skip:#d4a13a;
    --pass-text:#56d364; --fail-text:#ff7b72; --skip-text:#e3b341;
    --pass-bg:rgba(63,185,80,.15); --fail-bg:rgba(240,82,74,.15); --skip-bg:rgba(212,161,58,.16);
    --bar-pass:#2ea043; --bar-fail:#da3633; --bar-skip:#b9842a; --bar-text:#ffffff;
    --ph-given:#3f82e6; --ph-when:#9a6ae0; --ph-then:#1aa48d;
    --ph-given-ink:#2562c2; --ph-when-ink:#7237bd; --ph-then-ink:#0a7567;
    --v-create:#4f8bff; --v-read:#2dd4bf; --v-edit:#f59e3c; --v-delete:#c07bf0;
    --grid:rgba(180,200,230,.07); --lifeline:#39414e; --ruler-text:#6c7682;
    --accent:#5b86ff;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--bg-grad), var(--bg) 220px) fixed;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }

  /* ---------- APP BAR ---------- */
  .appbar{
    max-width:1180px; margin:0 auto; padding:26px 24px 8px;
  }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .brand .logo{
    width:34px; height:34px; border-radius:9px; flex:none;
    background:linear-gradient(135deg, var(--accent), #7aa2ff);
    display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px;
    box-shadow:var(--shadow-sm);
  }
  .brand h1{ font-size:17px; margin:0; font-weight:700; letter-spacing:-.01em; }
  .brand .sub{ font-size:12.5px; color:var(--muted); margin-top:1px; }
  .chips{ display:flex; gap:12px; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:13px;
    padding:11px 15px 11px 13px; box-shadow:var(--shadow-sm); min-width:118px;
  }
  .chip .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .chip .n{ font:650 21px/1 ui-monospace, Consolas, monospace; letter-spacing:-.02em; }
  .chip .l{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }
  .chip.pass .dot{ background:var(--pass); } .chip.pass .n{ color:var(--pass-text); }
  .chip.fail .dot{ background:var(--fail); } .chip.fail .n{ color:var(--fail-text); }
  .chip.skip .dot{ background:var(--skip); } .chip.skip .n{ color:var(--skip-text); }
  .chip.meta .n{ color:var(--ink); font-size:16px; }
  .chip.meta{ min-width:0; }

  /* ---------- PHASE LEGEND ---------- */
  .phase-legend{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .phase-legend .pl-title{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .phase-legend .it{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); }
  .phase-legend b{
    width:19px; height:19px; border-radius:5px; flex:none; display:grid; place-items:center;
    color:#fff; font:700 10.5px/1 ui-monospace, Consolas, monospace;
    box-shadow:var(--shadow-sm); border:1px solid rgba(0,0,0,.08);
  }
  .phase-legend b.g{ background:var(--ph-given); }
  .phase-legend b.w{ background:var(--ph-when); }
  .phase-legend b.t{ background:var(--ph-then); }

  /* ---------- SCENARIO CARD ---------- */
  main{ max-width:1180px; margin:0 auto; padding:14px 24px 60px; }
  .card{
    position:relative; background:var(--surface); border:1px solid var(--border);
    border-left:4px solid var(--edge); border-radius:14px; box-shadow:var(--shadow);
    padding:16px 20px 18px; margin:16px 0;
  }
  .card.s-passed{ --edge:var(--bar-pass); }
  .card.s-failed{ --edge:var(--bar-fail); }
  .card.s-skipped{ --edge:var(--bar-skip); }

  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
  .card-title{ min-width:0; }
  .card-title .name{ font-size:15.5px; font-weight:680; letter-spacing:-.01em; }
  .card-title .cls{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .card-title .cls .mth{ color:var(--faint); }
  .card-meta{ display:flex; align-items:center; gap:10px; flex:none; }
  .dur{ font:13px/1 ui-monospace, Consolas, monospace; color:var(--muted); }

  .pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .pill .pd{ width:7px; height:7px; border-radius:50%; }
  .pill.passed{ color:var(--pass-text); background:var(--pass-bg); } .pill.passed .pd{ background:var(--pass); }
  .pill.failed{ color:var(--fail-text); background:var(--fail-bg); } .pill.failed .pd{ background:var(--fail); }
  .pill.skipped{ color:var(--skip-text); background:var(--skip-bg); } .pill.skipped .pd{ background:var(--skip); }

  /* ---------- TIMELINE ---------- */
  .timeline{ --gutter:92px; --track:900px; }
  .tl-row{ display:grid; grid-template-columns:var(--gutter) var(--track); align-items:center; }
  .tl-gutter{
    font:11px/1 ui-monospace, Consolas, monospace; color:var(--faint);
    padding-right:12px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tl-track{ position:relative; height:30px; }

  /* ruler */
  .tl-ruler .tl-track{ height:26px; }
  .tl-ruler .tl-gutter{ color:var(--ruler-text); font-weight:600; }
  .tick{ position:absolute; top:0; bottom:0; }
  .tick .line{ position:absolute; left:0; top:14px; bottom:0; width:1px; background:var(--border-strong); }
  .tick .lab{ position:absolute; top:1px; left:0; font-size:10.5px; color:var(--ruler-text); white-space:nowrap; transform:translateX(calc(var(--f) * -100%)); }

  /* lane track gridlines */
  .lanes .tl-track{
    background:repeating-linear-gradient(to right, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent var(--tick));
  }

  .bar{
    position:absolute; top:4px; height:22px; border-radius:6px; background:var(--bcolor);
    color:var(--bar-text); display:flex; align-items:center; gap:6px; padding:0 8px;
    font-size:11.5px; white-space:nowrap; overflow:hidden; cursor:pointer;
    box-shadow:var(--shadow-sm); border:1px solid rgba(0,0,0,.07);
    transition:filter .12s ease, box-shadow .12s ease;
  }
  .bar.passed{ --bcolor:var(--bar-pass); }              /* fallback for unknown phases */
  .bar.passed.ph-given{ --bcolor:var(--ph-given); }     /* passing bars carry the phase hue */
  .bar.passed.ph-when{  --bcolor:var(--ph-when); }
  .bar.passed.ph-then{  --bcolor:var(--ph-then); }
  .bar.failed{ --bcolor:var(--bar-fail); }              /* status OVERRIDES phase: failed = red */
  .bar.skipped{ --bcolor:var(--bar-skip); }             /* status OVERRIDES phase: skipped = grey */
  .bar:hover{ filter:brightness(1.07); box-shadow:0 2px 8px rgba(0,0,0,.18); }
  .bar.active{ outline:2px solid var(--accent); outline-offset:1px; }
  .bar .ph{
    font:700 9.5px/1 ui-monospace, Consolas, monospace; letter-spacing:.04em;
    background:rgba(255,255,255,.92); color:var(--faint); border-radius:4px; padding:3px 4px; flex:none;
    text-shadow:none; box-shadow:0 0 0 .5px rgba(0,0,0,.06);
  }
  /* phase-tinted glyph stays decodable even when status (red/grey) overrides the bar fill */
  .bar.ph-given .ph{ color:var(--ph-given-ink); }
  .bar.ph-when  .ph{ color:var(--ph-when-ink); }
  .bar.ph-then  .ph{ color:var(--ph-then-ink); }
  .bar .lbl{ overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 1px rgba(0,0,0,.22); }

  /* resource lane */
  .res-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:14px 0 6px; padding-top:12px; border-top:1px dashed var(--border-strong);
  }
  .res-head .t{ font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
  .legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .res-row .tl-track{ height:26px; }
  .res-row .tl-gutter{ color:var(--muted); }
  .lifeline{ position:absolute; top:12px; height:2px; background:var(--lifeline); border-radius:2px; }
  .marker{
    position:absolute; top:7px; width:13px; height:13px; border-radius:50%;
    transform:translateX(-50%); border:2px solid var(--surface); box-shadow:0 0 0 1px rgba(0,0,0,.06);
    background:var(--mcolor); cursor:default;
  }
  .marker.create{ --mcolor:var(--v-create); } .marker.read,.marker.load{ --mcolor:var(--v-read); }
  .marker.edit{ --mcolor:var(--v-edit); } .marker.delete{ --mcolor:var(--v-delete); }

  /* ---------- DRILL PANEL (scenario-level: every step in run order) ---------- */
  .drill-host{ margin-top:4px; }
  .drill{
    display:none; margin-top:12px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:11px; padding:14px 16px; box-shadow:var(--shadow-sm);
  }
  .drill.open{ display:block; }
  .step-list{ display:flex; flex-direction:column; gap:10px; }
  .step-entry{
    border:1px solid var(--border); border-left:3px solid var(--se-edge, var(--border-strong));
    border-radius:9px; background:var(--surface); padding:10px 13px 12px; scroll-margin-top:18px;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .step-entry.ph-given{ --se-edge:var(--ph-given); }
  .step-entry.ph-when{ --se-edge:var(--ph-when); }
  .step-entry.ph-then{ --se-edge:var(--ph-then); }
  .step-entry.status-failed{ --se-edge:var(--bar-fail); }
  .step-entry.status-skipped{ --se-edge:var(--bar-skip); }
  .step-entry.focus{ box-shadow:0 0 0 2px var(--accent); }
  .step-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .step-head .sx{
    font:700 10.5px/1 ui-monospace, Consolas, monospace; color:var(--faint);
    background:var(--inset); border-radius:5px; padding:4px 6px; flex:none;
  }
  .step-head .ph-chip{
    color:#fff; padding:2px 7px; border-radius:5px; flex:none;
    font:700 11px/1.5 ui-monospace, Consolas, monospace;
  }
  .step-head .dn{ font-weight:640; font-size:13.5px; }
  .step-head .dm{ font:12px/1 ui-monospace, Consolas, monospace; color:var(--muted); margin-left:auto; }
  .sec{ margin-top:11px; }
  .sec h4{
    margin:0 0 7px; font-size:10.5px; font-weight:700; letter-spacing:.07em;
    text-transform:uppercase; color:var(--faint);
  }
  .logs{ margin:0; padding-left:20px; }
  .logs li{ font-family:ui-monospace, Consolas, monospace; font-size:12px; color:var(--ink); margin:2px 0; }
  .eff{ display:flex; flex-direction:column; gap:5px; }
  .eff .e{ display:flex; align-items:center; gap:9px; font-size:12.5px; flex-wrap:wrap; }
  .eff .vd{ width:9px; height:9px; border-radius:50%; flex:none; }
  .eff .vb{ font-weight:600; width:50px; text-transform:capitalize; }
  .eff .id{ font-family:ui-monospace, Consolas, monospace; }
  .eff .of{ font-family:ui-monospace, Consolas, monospace; color:var(--faint); }
  .eff .da{ color:var(--muted); font-size:12px; }
  .exc{
    margin:0; padding:11px 13px; border-radius:9px; overflow:auto;
    background:var(--fail-bg); border:1px solid color-mix(in srgb, var(--fail) 30%, transparent);
    color:var(--ink); font-family:ui-monospace, Consolas, monospace; font-size:12px; line-height:1.55; white-space:pre;
  }
  .skipnote{
    display:flex; align-items:center; gap:9px; padding:10px 13px; border-radius:9px;
    background:var(--skip-bg); border:1px solid color-mix(in srgb, var(--skip) 30%, transparent);
    color:var(--skip-text); font-size:12.5px;
  }
  .skipnote::before{ content:"\26A0"; font-size:14px; }
  .hint{ color:var(--faint); font-size:11.5px; margin:2px 0 10px; }

  /* ---------- OBJECT-FLOW OVERLAY ("lifelines dock into bars") ---------- */
  .timeline{ position:relative; }                 /* anchor for the absolute SVG overlay */
  .flow-svg{ position:absolute; left:0; top:0; pointer-events:none; overflow:visible; z-index:5; }
  /* connectors: always-on at a readable strength; hover only thickens the traced ones */
  .conn{
    fill:none; stroke-width:1.7; opacity:.7;
    stroke-linecap:round;
    transition:opacity .14s ease, stroke-width .14s ease;
  }
  .conn.lit{ opacity:1; stroke-width:2.6; }
  .dock{
    stroke:var(--surface); stroke-width:1.5; paint-order:stroke; opacity:.92;
    transition:opacity .14s ease;
  }
  .dock.lit{ opacity:1; }
  /* lifelines: readable by default, brighten + thicken when their object is traced */
  .res-row .lifeline{ opacity:.85; transition:opacity .14s ease, height .14s ease, top .14s ease; }
  .lifeline.lit{ opacity:1; height:3px; top:11px; box-shadow:0 0 0 1px rgba(255,255,255,.45); }
  /* a bar that currently has object flow threaded through it gets outlined (hover emphasis only) */
  .bar.flow-bar{ box-shadow:0 0 0 2px var(--surface), 0 0 0 3.6px var(--accent), 0 2px 9px rgba(0,0,0,.20); }
  /* connector identity chips: the object's Type:Key, riding its flow — shown by default */
  .flow-label{ opacity:1; pointer-events:auto; cursor:default; transition:opacity .14s ease; }
  .flow-label.lit text{ font-weight:700; }
  .flow-label rect{ stroke-width:1.2; filter:drop-shadow(0 1px 1.4px rgba(0,0,0,.22)); }
  .flow-label text{
    fill:var(--ink); letter-spacing:-.01em;
    font:600 10px/1 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .res-row{ cursor:pointer; }
  .res-row:hover .tl-gutter{ color:var(--ink); font-weight:600; }

  /* flows legend (resource-type colours, populated from the model) */
  .flow-legend{ display:flex; align-items:center; gap:13px; flex-wrap:wrap; margin-top:8px; }
  .flow-legend .ttl{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .flow-legend .it{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  .flow-legend i{ width:17px; height:0; border-top:2.4px solid var(--fc); border-radius:2px; display:inline-block; }
  .flow-hint{ font-size:11.5px; color:var(--faint); }
</style>
</head>
<body>
  <div class="appbar">
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <h1>PUnit run report</h1>
        <div class="sub" id="genline"></div>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="phase-legend" aria-label="Given / When / Then phase colors">
      <span class="pl-title">Phases</span>
      <span class="it"><b class="g">G</b>Given</span>
      <span class="it"><b class="w">W</b>When</span>
      <span class="it"><b class="t">T</b>Then</span>
    </div>
    <div class="flow-legend" id="flowlegend" aria-label="Object flow colors per resource type">
      <span class="ttl">Object flows</span>
      <span class="flow-types"></span>
      <span class="flow-hint">object flows shown by default &middot; hover a step or resource to emphasise its path</span>
    </div>
  </div>
  <main id="report"></main>

  <script id="model" type="application/json">/*__PUNIT_REPORT_JSON__*/</script>

  <script>
    "use strict";
    // explicit theme override for deterministic screenshots
    (function(){
      const p = new URLSearchParams(location.search).get("theme");
      if (p === "dark" || p === "light") document.documentElement.dataset.theme = p;
    })();

    const TRACK = 900, MIN_BAR = 30;
    const model = JSON.parse(document.getElementById("model").textContent);

    const esc = (x) => { const d = document.createElement("div"); d.textContent = x == null ? "" : String(x); return d.innerHTML; };
    const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

    function fmtDur(ms){
      if (ms >= 1000) return (ms / 1000).toFixed(2) + " s";
      return Math.round(ms) + " ms";
    }
    function fmtGen(iso){
      // 2026-06-19T21:42:11Z -> 2026-06-19 21:42:11 UTC
      return iso.replace("T", " ").replace("Z", " UTC").replace(/(\.\d+)/, "");
    }

    // ---- nice auto-scaled axis -------------------------------------------
    function niceAxis(maxMs){
      maxMs = Math.max(maxMs, 1);
      const raw = maxMs / 6;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / mag;
      const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
      const axisMax = Math.ceil(maxMs / step) * step;
      return { step, axisMax };
    }
    function fmtTick(ms, axisMax){
      if (ms === 0) return "0";
      if (axisMax >= 1000){ const s = ms / 1000; return (s % 1 === 0 ? s.toFixed(0) : s.toFixed(1)) + "s"; }
      return ms + "";
    }

    // ---- summary chips ----------------------------------------------------
    const sum = model.summary;
    document.getElementById("genline").textContent =
      model.scenarios.length + " scenarios · generated " + fmtGen(model.generatedAtUtc);
    const chips = document.getElementById("chips");
    const chipDefs = [
      ["pass", sum.passed, "passed"],
      ["fail", sum.failed, "failed"],
      ["skip", sum.skipped, "skipped"],
    ];
    for (const [c, n, l] of chipDefs){
      const e = el("div", "chip " + c);
      e.innerHTML = '<span class="dot"></span><div><div class="n">' + n + '</div><div class="l">' + l + "</div></div>";
      chips.appendChild(e);
    }
    const tw = el("div", "chip meta");
    tw.innerHTML = '<div><div class="n mono">' + fmtDur(sum.totalMs) + '</div><div class="l">wall clock</div></div>';
    chips.appendChild(tw);
    const tg = el("div", "chip meta");
    tg.innerHTML = '<div><div class="n">' + esc(fmtGen(model.generatedAtUtc)) + '</div><div class="l">generated</div></div>';
    chips.appendChild(tg);

    // ---- resource-type colours (stable, distinct, palette-cycled) ---------
    const PALETTE = ["#2f74d0", "#e07a14", "#8350c4", "#0c8576", "#d2417f", "#2aa36a", "#b3892a", "#5566d6"];
    const typeColorMap = new Map();
    for (const sc of model.scenarios)
      for (const r of sc.resources)
        if (!typeColorMap.has(r.type)) typeColorMap.set(r.type, PALETTE[typeColorMap.size % PALETTE.length]);
    function typeColor(t){
      if (typeColorMap.has(t)) return typeColorMap.get(t);
      let h = 0; const k = t || ""; for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) % 360;
      return "hsl(" + h + " 60% 45%)";
    }

    // object-flow legend (one swatch per distinct resource type in the run)
    const flowLegend = document.getElementById("flowlegend");
    if (typeColorMap.size){
      const types = flowLegend.querySelector(".flow-types");
      for (const [t, color] of typeColorMap){
        const it = el("span", "it");
        it.innerHTML = '<i style="--fc:' + color + '"></i>' + esc(t);
        types.appendChild(it);
      }
    } else {
      flowLegend.style.display = "none";
    }

    // ---- scenarios --------------------------------------------------------
    const VCOLOR = { create: "var(--v-create)", read: "var(--v-read)", load: "var(--v-read)", edit: "var(--v-edit)", delete: "var(--v-delete)" };
    const PHCOLOR = { given: "var(--ph-given)", when: "var(--ph-when)", then: "var(--ph-then)" };
    // readable past-tense verbs for the connector identity chips ("Read Patient:Jane")
    const VERB_PAST = { create: "Created", read: "Read", edit: "Edited", delete: "Deleted", load: "Loaded" };
    const report = document.getElementById("report");
    const openers = [];

    // ---- object-flow overlay state ---------------------------------------
    const SVGNS = "http://www.w3.org/2000/svg";
    const flowCtx = [];    // per-scenario render context, consumed by the overlay pass after layout
    const flows = [];      // every connector { path, dock, bar, res, stepId, lifeline, scenarioId }
    let pinned = null;     // { type:"step"|"res", scenarioId, id } or null  (explicit, sticky highlight)

    for (const sc of model.scenarios) report.appendChild(renderScenario(sc));

    // pre-expand the first failing step's scenario drill so detail is visible by default
    // (object flows are always visible; hover/click only emphasises a single path)
    for (const sc of model.scenarios){
      const failing = sc.steps.find((s) => s.status === "failed");
      if (failing){
        const o = openers.find((x) => x.scenarioId === sc.scenarioId);
        if (o){ o.open(failing.stepId); break; }
      }
    }

    // ---- object-flow overlay pass (runs after the timeline has been laid out) ----
    for (const ctx of flowCtx) buildFlowOverlay(ctx);
    refresh();   // resting state already shows every flow; this only re-applies a pin if one exists
    // keep connectors anchored if the viewport width changes
    let raf = 0;
    window.addEventListener("resize", () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        flows.length = 0;
        document.querySelectorAll(".flow-svg").forEach((s) => s.remove());
        for (const ctx of flowCtx) buildFlowOverlay(ctx);
        refresh();
      });
    });

    // clicking empty space clears any pinned highlight
    document.addEventListener("click", (e) => {
      if (e.target.closest(".bar, .res-row")) return;   // handled by their own listeners
      if (pinned){ pinned = null; refresh(); }
    });

    // ---- highlight machinery (strictly scoped; always clears) -------------
    function clearLit(){
      for (const f of flows){
        f.path.classList.remove("lit"); f.dock.classList.remove("lit");
        f.bar.classList.remove("flow-bar"); if (f.lifeline) f.lifeline.classList.remove("lit");
        if (f.label) f.label.classList.remove("lit");
      }
    }
    function applyLit(pred){
      clearLit();
      for (const f of flows){
        if (!pred(f)) continue;
        f.path.classList.add("lit"); f.dock.classList.add("lit");
        f.bar.classList.add("flow-bar"); if (f.lifeline) f.lifeline.classList.add("lit");
        if (f.label) f.label.classList.add("lit");
      }
    }
    // hovering a step traces every object it produces/consumes (lifelines + all their
    // dock-connectors + the bars at the far ends), scoped to this one scenario.
    function litByStep(scenarioId, stepId){
      const resIds = new Set();
      for (const f of flows) if (f.scenarioId === scenarioId && f.stepId === stepId) resIds.add(f.res);
      applyLit((f) => f.scenarioId === scenarioId && resIds.has(f.res));
    }
    // hovering a resource traces that one object's full path.
    function litByRes(scenarioId, resId){
      applyLit((f) => f.scenarioId === scenarioId && f.res === resId);
    }
    // revert to the resting state: the pinned highlight if any, otherwise everything faint.
    function refresh(){
      if (!pinned){ clearLit(); return; }
      if (pinned.type === "step") litByStep(pinned.scenarioId, pinned.id);
      else litByRes(pinned.scenarioId, pinned.id);
    }

    // ---- build one scenario's SVG connector overlay -----------------------
    function buildFlowOverlay(ctx){
      const { sc, timeline, barByStep, markerInfos, lifelineByRes } = ctx;
      const tl = timeline.getBoundingClientRect();
      const W = timeline.scrollWidth, H = timeline.scrollHeight;
      const svg = document.createElementNS(SVGNS, "svg");
      svg.setAttribute("class", "flow-svg");
      svg.setAttribute("width", W); svg.setAttribute("height", H);
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);

      const defs = document.createElementNS(SVGNS, "defs");
      svg.appendChild(defs);
      const arrowByColor = new Map();
      function arrowFor(color){
        if (arrowByColor.has(color)) return arrowByColor.get(color);
        const id = "arr-" + sc.scenarioId + "-" + arrowByColor.size;
        const mk = document.createElementNS(SVGNS, "marker");
        mk.setAttribute("id", id); mk.setAttribute("viewBox", "0 0 10 10");
        mk.setAttribute("refX", "7.5"); mk.setAttribute("refY", "5");
        mk.setAttribute("markerWidth", "5.5"); mk.setAttribute("markerHeight", "5.5");
        mk.setAttribute("orient", "auto");
        const tip = document.createElementNS(SVGNS, "path");
        tip.setAttribute("d", "M0,0 L10,5 L0,10 z"); tip.setAttribute("fill", color);
        mk.appendChild(tip); defs.appendChild(mk);
        arrowByColor.set(color, id); return id;
      }

      const labels = [];   // identity chips, positioned after a de-overlap pass below
      for (const mi of markerInfos){
        const bar = barByStep.get(mi.stepId);
        if (!bar) continue;
        const mr = mi.markerEl.getBoundingClientRect();
        const br = bar.getBoundingClientRect();
        const x = mr.left + mr.width / 2 - tl.left;       // marker centre x
        const yMark = mr.top - tl.top;                     // marker top edge
        const barLeft = br.left - tl.left, barRight = br.right - tl.left;
        const yBar = br.bottom - tl.top;                   // bar bottom edge (the dock line)
        const dockX = Math.min(Math.max(x, barLeft + 5), barRight - 5);
        const color = typeColor(mi.type);
        const produce = mi.verb.toLowerCase() === "create";
        // produce: bar -> lifeline (dips DOWN); consume: lifeline -> bar (rises UP)
        const p0 = produce ? { x: dockX, y: yBar } : { x: x, y: yMark };
        const p1 = produce ? { x: x, y: yMark } : { x: dockX, y: yBar };
        // STRAIGHT direct-diagonal connector: bar dock -> lifeline marker (no curves)
        const d = "M " + p0.x + " " + p0.y + " L " + p1.x + " " + p1.y;

        const path = document.createElementNS(SVGNS, "path");
        path.setAttribute("d", d);
        path.setAttribute("class", "conn");
        path.setAttribute("stroke", color);
        path.setAttribute("marker-end", "url(#" + arrowFor(color) + ")");
        svg.appendChild(path);

        const dock = document.createElementNS(SVGNS, "circle");
        dock.setAttribute("cx", dockX); dock.setAttribute("cy", yBar);
        dock.setAttribute("r", "3.4"); dock.setAttribute("fill", color);
        dock.setAttribute("class", "dock");
        svg.appendChild(dock);

        // identity chip ("{Verb} Type:Key") riding this connector. Anchored along the bar->marker
        // line, biased toward the resource end so chips of the same step spread out by lane/row depth.
        const verbPast = VERB_PAST[mi.verb.toLowerCase()] || mi.verb;
        const full = verbPast + " " + mi.resId, MAXC = 30, CW = 6.2;
        const disp = full.length > MAXC ? full.slice(0, MAXC - 1) + "…" : full;
        const lw = Math.round(disp.length * CW + 14), lh = 16, fr = 0.78;
        const cx = dockX + (x - dockX) * fr;
        const cy = yBar + (yMark - yBar) * fr;
        const g = document.createElementNS(SVGNS, "g");
        g.setAttribute("class", "flow-label");
        const ti = document.createElementNS(SVGNS, "title"); ti.textContent = full; g.appendChild(ti);
        const rc = document.createElementNS(SVGNS, "rect");
        rc.setAttribute("rx", "5"); rc.setAttribute("ry", "5");
        rc.style.fill = "color-mix(in srgb, " + color + " 17%, var(--surface))";
        rc.style.stroke = color;
        g.appendChild(rc);
        const tx = document.createElementNS(SVGNS, "text");
        tx.setAttribute("text-anchor", "middle"); tx.setAttribute("dominant-baseline", "central");
        tx.textContent = disp;
        g.appendChild(tx);
        // hovering a lit chip keeps its object traced (so it stays readable / shows its title)
        g.addEventListener("mouseenter", () => litByRes(sc.scenarioId, mi.resId));
        g.addEventListener("mouseleave", refresh);
        labels.push({ g, rc, tx, cx, cy, w: lw, h: lh });

        flows.push({
          path, dock, bar, label: g, res: mi.resId, stepId: mi.stepId,
          lifeline: lifelineByRes.get(mi.resId), scenarioId: sc.scenarioId,
        });
      }

      // de-overlap the chips (greedy vertical nudge within this scenario), then commit positions.
      // Chips overlap only when several flows share an x band (e.g. multiple objects docking the same
      // step bar); nudging the lower ones down keeps each Type:Key legible without stacking.
      const placed = [];
      for (const L of labels.sort((a, b) => a.cy - b.cy)){
        let moved = true;
        while (moved){
          moved = false;
          for (const P of placed){
            if (Math.abs(L.cx - P.cx) < (L.w + P.w) / 2 + 4 &&
                Math.abs(L.cy - P.cy) < (L.h + P.h) / 2 + 3){
              L.cy = P.cy + (L.h + P.h) / 2 + 3; moved = true;
            }
          }
        }
        placed.push(L);
      }
      const labelsLayer = document.createElementNS(SVGNS, "g");
      labelsLayer.setAttribute("class", "flow-labels");
      for (const L of labels){
        L.rc.setAttribute("x", L.cx - L.w / 2); L.rc.setAttribute("y", L.cy - L.h / 2);
        L.rc.setAttribute("width", L.w); L.rc.setAttribute("height", L.h);
        L.tx.setAttribute("x", L.cx); L.tx.setAttribute("y", L.cy);
        labelsLayer.appendChild(L.g);
      }
      svg.appendChild(labelsLayer);   // chips ride on top of all connectors
      timeline.appendChild(svg);
    }

    function renderScenario(sc){
      const card = el("section", "card s-" + sc.status);

      // header
      const head = el("div", "card-head");
      head.innerHTML =
        '<div class="card-title">' +
          '<div class="name">' + esc(sc.displayName) + "</div>" +
          '<div class="cls">' + esc(sc.classDisplayName || "") +
            ' <span class="mth mono">· ' + esc(sc.methodName) + "</span></div>" +
        "</div>" +
        '<div class="card-meta">' +
          '<span class="dur">' + fmtDur(sc.durationMs) + "</span>" +
          '<span class="pill ' + sc.status + '"><span class="pd"></span>' + sc.status + "</span>" +
        "</div>";
      card.appendChild(head);

      // axis
      const axisMaxRaw = sc.steps.reduce((m, s) => Math.max(m, s.offsetMs + s.durationMs), 0);
      const { step, axisMax } = niceAxis(axisMaxRaw);
      const px = TRACK / axisMax;             // px per ms (auto-scaled per scenario)
      const tickPx = step * px;

      // ---- LOGICAL activity-pin positions (input/output pins by verb) -------
      // Position every resource event by its STEP's window, not its recorded offset:
      //   read / load          -> the step's START (input pin / leading edge)
      //   create / edit/delete -> the step's END   (output pin / trailing edge)
      const stepById = new Map();
      for (const s of sc.steps) stepById.set(s.stepId, s);
      const INPUT_VERBS = new Set(["read", "load"]);
      function eventPinMs(ev){
        const st = stepById.get(ev.stepId);
        if (!st) return ev.offsetMs;                       // defensive fallback
        return INPUT_VERBS.has(ev.verb.toLowerCase())
          ? st.offsetMs                                     // leading edge (input pin)
          : st.offsetMs + st.durationMs;                    // trailing edge (output pin)
      }

      const timeline = el("div", "timeline");
      timeline.style.setProperty("--tick", tickPx + "px");

      // ruler
      const ruler = el("div", "tl-row tl-ruler");
      const rg = el("div", "tl-gutter");
      rg.textContent = axisMax >= 1000 ? "s" : "ms";
      const rt = el("div", "tl-track");
      for (let v = 0; v <= axisMax + 0.5; v += step){
        const f = v / axisMax;
        const t = el("div", "tick");
        t.style.left = (f * TRACK) + "px";
        const lab = el("div", "lab"); lab.style.setProperty("--f", f); lab.textContent = fmtTick(v, axisMax);
        const line = el("div", "line");
        t.appendChild(lab); t.appendChild(line);
        rt.appendChild(t);
      }
      ruler.appendChild(rg); ruler.appendChild(rt);
      timeline.appendChild(ruler);

      // lane rows
      const lanesWrap = el("div", "lanes");
      const laneCount = sc.steps.reduce((m, s) => Math.max(m, s.lane), 0) + 1;
      const bars = [];     // { stepId, bar }

      // object-flow bookkeeping for this scenario
      const barByStep = new Map();
      const markerInfos = [];
      const lifelineByRes = new Map();

      // one scenario-level drill panel: every step in run order
      const drill = buildScenarioDrill(sc);

      function setActiveBar(stepId){
        for (const { bar } of bars) bar.classList.toggle("active", stepId != null && bar.dataset.step === stepId);
      }
      // open the panel and focus/scroll to a step; toggle closes when re-focusing the same step
      function focusStep(stepId, { toggle = false } = {}){
        const open = drill.classList.contains("open");
        const same = drill.dataset.focus === stepId;
        if (toggle && open && same){
          drill.classList.remove("open"); drill.dataset.focus = "";
          setActiveBar(null);
          return false;
        }
        drill.classList.add("open"); drill.dataset.focus = stepId;
        for (const entry of drill.querySelectorAll(".step-entry"))
          entry.classList.toggle("focus", entry.dataset.step === stepId);
        setActiveBar(stepId);
        const entry = drill.querySelector('.step-entry[data-step="' + stepId + '"]');
        if (entry) entry.scrollIntoView({ block: "nearest" });
        return true;
      }

      for (let lane = 0; lane < laneCount; lane++){
        const row = el("div", "tl-row");
        const g = el("div", "tl-gutter");
        const track = el("div", "tl-track");
        for (const s of sc.steps.filter((s) => s.lane === lane)){
          const bar = el("div", "bar " + s.status + " ph-" + s.phase.toLowerCase());
          bar.dataset.step = s.stepId;
          barByStep.set(s.stepId, bar);
          bar.style.left = (s.offsetMs * px) + "px";
          bar.style.width = Math.max(MIN_BAR, s.durationMs * px) + "px";
          bar.innerHTML = '<span class="ph">' + s.phase[0] + '</span><span class="lbl">' + esc(s.displayName) + "</span>";
          bar.title = s.phase + " · " + s.displayName + "  (" + fmtDur(s.durationMs) + " @ +" + s.offsetMs + "ms)";
          bar.onclick = () => {
            const nowOpen = focusStep(s.stepId, { toggle: true });
            pinned = nowOpen ? { type: "step", scenarioId: sc.scenarioId, id: s.stepId } : null;
            refresh();
          };
          bar.addEventListener("mouseenter", () => litByStep(sc.scenarioId, s.stepId));
          bar.addEventListener("mouseleave", refresh);
          bars.push({ stepId: s.stepId, bar });
          track.appendChild(bar);
        }
        row.appendChild(g); row.appendChild(track);
        lanesWrap.appendChild(row);
      }
      timeline.appendChild(lanesWrap);

      // resources
      if (sc.resources.length){
        const rh = el("div", "res-head");
        rh.innerHTML = '<span class="t">Resources</span>' +
          '<span class="legend">' +
            '<span><i style="background:var(--v-create)"></i>create</span>' +
            '<span><i style="background:var(--v-read)"></i>read</span>' +
            '<span><i style="background:var(--v-edit)"></i>edit</span>' +
            '<span><i style="background:var(--v-delete)"></i>delete</span>' +
          "</span>";
        timeline.appendChild(rh);

        for (const r of sc.resources){
          const row = el("div", "tl-row res-row");
          const g = el("div", "tl-gutter"); const label = r.type + ":" + r.key;
          g.textContent = label; g.title = label;
          const track = el("div", "tl-track");
          const pins = r.events.map(eventPinMs);
          const createEv = r.events.find((e) => e.verb.toLowerCase() === "create");
          const deleteEv = r.events.find((e) => e.verb.toLowerCase() === "delete");
          // lifeline: from first appearance (Create's output pin, else the earliest pin)
          //   to its Delete pin, else all the way to the scenario end (rightmost step end).
          const lo = createEv ? eventPinMs(createEv) : Math.min(...pins);
          const hi = deleteEv ? eventPinMs(deleteEv) : axisMaxRaw;
          const tc = typeColor(r.type);
          const line = el("div", "lifeline");
          line.style.left = (lo * px) + "px"; line.style.width = Math.max(2, (hi - lo) * px) + "px";
          line.style.background = tc;                 // colour the lifeline by resource type
          track.appendChild(line);
          lifelineByRes.set(label, line);
          for (const ev of r.events){
            const m = el("div", "marker " + ev.verb.toLowerCase());
            m.style.left = (eventPinMs(ev) * px) + "px";
            m.title = ev.verb + " " + label + " @ +" + ev.offsetMs + "ms";
            track.appendChild(m);
            markerInfos.push({ resId: label, type: r.type, stepId: ev.stepId, verb: ev.verb, markerEl: m });
          }
          row.addEventListener("mouseenter", () => litByRes(sc.scenarioId, label));
          row.addEventListener("mouseleave", refresh);
          row.addEventListener("click", () => {
            const isPin = pinned && pinned.type === "res" && pinned.scenarioId === sc.scenarioId && pinned.id === label;
            pinned = isPin ? null : { type: "res", scenarioId: sc.scenarioId, id: label };
            refresh();
          });
          row.appendChild(g); row.appendChild(track);
          timeline.appendChild(row);
        }
      }

      flowCtx.push({ sc, timeline, barByStep, markerInfos, lifelineByRes });

      card.appendChild(timeline);
      const drillHost = el("div", "drill-host");
      drillHost.appendChild(drill);
      card.appendChild(drillHost);

      // opener for the pre-expand pass: open the drill focused on a step (no flow pin)
      openers.push({ scenarioId: sc.scenarioId, open: (stepId) => focusStep(stepId) });

      return card;
    }

    // every step of a scenario, in run order, as one expandable list
    function buildScenarioDrill(sc){
      const p = el("div", "drill scenario-drill");
      p.dataset.focus = "";
      let h = '<div class="hint">All steps in run order — click a bar to jump to a step.</div>' +
              '<div class="step-list">';
      for (const s of sc.steps){
        h += '<div class="step-entry status-' + s.status + ' ph-' + s.phase.toLowerCase() + '" data-step="' + esc(s.stepId) + '">' +
          '<div class="step-head">' +
            '<span class="sx">#' + s.index + "</span>" +
            '<span class="ph-chip" style="background:' + (PHCOLOR[s.phase.toLowerCase()] || "var(--faint)") + '">' + esc(s.phase) + "</span>" +
            '<span class="dn">' + esc(s.displayName) + "</span>" +
            '<span class="pill ' + s.status + '"><span class="pd"></span>' + s.status + "</span>" +
            '<span class="dm">+' + s.offsetMs + "ms · " + fmtDur(s.durationMs) + "</span>" +
          "</div>";

        if (s.skipReason){
          h += '<div class="sec"><div class="skipnote">' + esc(s.skipReason) + "</div></div>";
        }
        if (s.logs && s.logs.length){
          h += '<div class="sec"><h4>Logs</h4><ol class="logs">' +
            s.logs.map((l) => "<li>" + esc(l) + "</li>").join("") + "</ol></div>";
        }
        if (s.effects && s.effects.length){
          h += '<div class="sec"><h4>Effects</h4><div class="eff">' +
            s.effects.map((e) =>
              '<div class="e">' +
                '<span class="vd" style="background:' + (VCOLOR[e.verb.toLowerCase()] || "var(--faint)") + '"></span>' +
                '<span class="vb">' + esc(e.verb) + "</span>" +
                '<span class="id">' + esc(e.type) + ":" + esc(e.key) + "</span>" +
                '<span class="of">+' + e.offsetMs + "ms</span>" +
                (e.data ? '<span class="da">· ' + esc(e.data) + "</span>" : "") +
              "</div>"
            ).join("") + "</div></div>";
        }
        if (s.exception){
          h += '<div class="sec"><h4>Exception</h4><pre class="exc">' + esc(s.exception) + "</pre></div>";
        }
        h += "</div>";
      }
      h += "</div>";
      p.innerHTML = h;
      return p;
    }
  </script>
</body>
</html>
