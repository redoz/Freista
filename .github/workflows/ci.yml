name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer derives the version from the nearest v* tag, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Raun.slnx -c Release

      - name: Test
        run: dotnet test Raun.slnx -c Release --no-build

      - name: Pack (verifies the packages assemble on every push)
        run: |
          dotnet pack src/Raun/Raun.csproj -c Release --no-build -o artifacts
          dotnet pack src/Raun.Mtp/Raun.Mtp.csproj -c Release --no-build -o artifacts
          dotnet pack src/Raun.Aspire/Raun.Aspire.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/*.nupkg

      # Every push to main publishes its preview build (0.x.y-preview.0.N) to the repository's
      # GitHub Packages feed, so the current head is always consumable. Tags publish real versions
      # through release.yml. GitHub Packages does not accept .snupkg, so only .nupkg is pushed.
      - name: Publish preview to GitHub Packages
        if: github.event_name == 'push'
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
