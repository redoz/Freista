name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from the nearest v* tag, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Freista.slnx -c Release

      - name: Test
        run: dotnet test Freista.slnx -c Release --no-build

      - name: Pack (verifies the packages assemble on every push)
        run: |
          dotnet pack src/Freista/Freista.csproj -c Release --no-build -o artifacts
          dotnet pack src/Freista.Mtp/Freista.Mtp.csproj -c Release --no-build -o artifacts
          dotnet pack src/Freista.Aspire/Freista.Aspire.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
